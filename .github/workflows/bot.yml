name: Herat Currency Bot

on:
workflow_dispatch:
schedule:
- cron: "17,22,27,32,37,42,47,52,57,2,7,12 * * * *"

permissions:
contents: read

jobs:
update-rates:
runs-on: ubuntu-latest
steps:
- name: Get repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install requirements
    run: pip install -r requirements.txt

  - name: Run bot
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    run: python bot.py
