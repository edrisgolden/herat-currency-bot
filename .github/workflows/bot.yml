name: Herat Currency Bot

on:
schedule:
- cron: "*/5 * * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update-rates:
runs-on: ubuntu-latest
steps:
- name: Get repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install requirements
    run: pip install -r requirements.txt

  - name: Restore previous rates
    uses: actions/cache/restore@v4
    with:
      path: last_rates.json
      key: rates-${{ github.run_id }}
      restore-keys: |
        rates-

  - name: Run bot
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    run: python bot.py

  - name: Save previous rates
    uses: actions/cache/save@v4
    if: always()
    with:
      path: last_rates.json
      key: rates-${{ github.run_id }}
